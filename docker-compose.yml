version: '3.8'

services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: ecommerce_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_network

  # 2. Bộ nhớ đệm và Blacklist Redis
  redis-cache:
    image: redis:alpine
    container_name: ecommerce_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ecommerce_network

  # 3. Ứng dụng FastAPI
  fastapi-app:
    build: .
    container_name: ecommerce_fastapi
    restart: always
    depends_on:
      - postgres-db
      - redis-cache
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      # Tên host trong mạng Docker tương ứng với tên service:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ecommerce_db
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      SECRET_KEY: super_secret_jwt_key_ecommerce_production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    ports:
      - "8000:8000"
    networks:
      - ecommerce_network

volumes:
  postgres_data:

networks:
  ecommerce_network:
    driver: bridge